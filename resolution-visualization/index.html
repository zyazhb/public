<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lens resolution — 3D surfaces</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0e1a;
      }
      #chart {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }
      #canvas-wrap {
        position: absolute;
        inset: 0;
      }
      #canvas-wrap canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: "DM Sans", system-ui, sans-serif;
      }
      #hud .hud-header,
      #hud .layer-panel,
      #hud .light-panel,
      #hud .layer-row {
        pointer-events: auto;
      }
      .hud-header {
        position: absolute;
        top: 1.1rem;
        left: 1.1rem;
        right: 1.1rem;
        max-width: 28rem;
        padding: 1rem 1.15rem 1.05rem;
        background: linear-gradient(
          145deg,
          rgba(15, 23, 42, 0.82),
          rgba(30, 27, 55, 0.72)
        );
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.35),
          0 20px 50px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }
      .hud-header h1 {
        margin: 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 1.55rem;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: #f1f5f9;
        line-height: 1.15;
      }
      .hud-sub {
        margin: 0.45rem 0 0;
        font-size: 0.78rem;
        line-height: 1.45;
        color: #94a3b8;
        font-weight: 400;
      }
      .layer-panel {
        position: absolute;
        top: 1.1rem;
        right: 1.1rem;
        width: min(22rem, calc(100vw - 2.2rem));
        max-height: min(58vh, 28rem);
        overflow-y: auto;
        padding: 0.65rem 0.75rem;
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 10px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
      }
      .layer-row {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.4rem 0.35rem;
        border-radius: 6px;
        cursor: pointer;
        color: #e2e8f0;
        font-size: 0.75rem;
        line-height: 1.35;
      }
      .layer-row:hover {
        background: rgba(51, 65, 85, 0.35);
      }
      .layer-row input {
        margin-top: 0.2rem;
        accent-color: #38bdf8;
        cursor: pointer;
      }
      .layer-name {
        flex: 1;
      }
      .light-panel {
        position: absolute;
        bottom: 1.1rem;
        left: 1.1rem;
        width: min(17.5rem, calc(100vw - 2.2rem));
        padding: 0.65rem 0.75rem 0.75rem;
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 10px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(10px);
      }
      .light-panel-title {
        margin: 0 0 0.5rem;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #cbd5e1;
      }
      .light-row {
        display: grid;
        grid-template-columns: 4.2rem 1fr 2.5rem;
        align-items: center;
        gap: 0.35rem;
        margin-bottom: 0.35rem;
        font-size: 0.68rem;
        color: #e2e8f0;
      }
      .light-label {
        color: #94a3b8;
      }
      .light-row input[type="range"] {
        width: 100%;
        accent-color: #fbbf24;
        cursor: pointer;
      }
      .light-value {
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: #f1f5f9;
      }
      .light-reset {
        width: 100%;
        margin-top: 0.35rem;
        padding: 0.35rem 0.5rem;
        font-family: inherit;
        font-size: 0.68rem;
        font-weight: 600;
        color: #e2e8f0;
        background: rgba(51, 65, 85, 0.55);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 6px;
        cursor: pointer;
      }
      .light-reset:hover {
        background: rgba(71, 85, 105, 0.65);
      }
      .tooltip {
        position: fixed;
        z-index: 50;
        min-width: 10rem;
        max-width: 18rem;
        padding: 0.65rem 0.75rem;
        font-size: 0.72rem;
        line-height: 1.45;
        color: #e2e8f0;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 8px;
        box-shadow:
          0 0 24px rgba(56, 189, 248, 0.12),
          0 12px 32px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      .tooltip strong {
        display: block;
        margin-bottom: 0.35rem;
        color: #f8fafc;
        font-weight: 600;
        font-size: 0.76rem;
      }
      .tooltip .lwph {
        display: inline-block;
        margin-top: 0.35rem;
        font-variant-numeric: tabular-nums;
        color: #7dd3fc;
        font-weight: 600;
      }
      .tooltip .lwph.nodata {
        color: #94a3b8;
        font-weight: 500;
      }
      .axis-label-title {
        padding: 0.2rem 0.45rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #f1f5f9;
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 6px;
        white-space: nowrap;
        pointer-events: none;
      }
      .axis-tick {
        padding: 0.12rem 0.28rem;
        font-size: 0.62rem;
        font-weight: 500;
        color: #cbd5e1;
        background: rgba(15, 23, 42, 0.78);
        border-radius: 4px;
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  <script type="module" crossorigin src="./index-gxjmqfft.js"></script></head>
  <body>
    <div id="chart"></div>
    
  </body>
</html>
